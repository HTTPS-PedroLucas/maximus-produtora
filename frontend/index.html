<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08070b" />
    <meta name="description" content="Máximus Produtora — planejamento, captação e produção em um só lugar." />
    <title>Máximus Produtora — Agenda de Captações</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, evitando piscar a tela.
      (function () {
        try {
          var saved = localStorage.getItem('maximus_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.background = theme === 'light' ? '#f2f0f6' : '#08070b';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
